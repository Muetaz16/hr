<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPH Careers — Join Our Team</title>
    <meta name="description" content="Explore open positions at IPH and apply online." />
    <link rel="icon" type="image/png" href="logo.png" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-logo"><img src="logo.png" alt="IPH" /></div>
                <div>
                    <div class="brand-name">IPH Careers</div>
                    <div class="brand-tag">Build your future with us</div>
                </div>
            </div>
            <a href="#positions" class="header-link">Open Roles</a>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Join a team that's shaping what's next.</h1>
            <p class="hero-sub">Browse our open positions and apply in minutes — upload your CV and we'll take it from there.</p>
        </div>
    </section>

    <main id="positions" class="container main">
        <div id="root"></div>
    </main>

    <footer class="site-footer">
        <div class="container">© <span id="year"></span> <span class="footer-company"></span>. All rights reserved.</div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
