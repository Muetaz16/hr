<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IPH — New Hire Onboarding</title>
    <meta name="robots" content="noindex" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-logo"><img src="logo.png" alt="IPH" /></div>
                <div>
                    <div class="brand-name">IPH Onboarding</div>
                    <div class="brand-tag">Welcome aboard — let's get you set up</div>
                </div>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h1 class="hero-title">Complete your onboarding</h1>
            <p class="hero-sub">Please fill in your details and upload your documents. Your information goes straight to our HR team.</p>
        </div>
    </section>

    <main class="container main">
        <div id="root"></div>
    </main>

    <footer class="site-footer">
        <div class="container">© <span id="year"></span> <span class="footer-company"></span>. All rights reserved.</div>
    </footer>

    <script src="onboard.js"></script>
</body>
</html>
